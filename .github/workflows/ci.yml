name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      - name: dist/ is in sync with src/
        run: |
          npm run build
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

  types:
    name: Type definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # types/sample.ts uses the whole public surface, so this fails if the
      # hand-written types/index.d.ts drifts from src/.
      - run: npm run types

  dead-names:
    name: No dead names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project was renamed to chessmen; the old names must not come back.
      # Two files name them on purpose and are excluded: CHANGELOG.md records the
      # rename, and docs/redirects/ forwards the old demo URL. The [x] in each
      # pattern still matches the real name but stops this file matching itself.
      - name: Check tracked files for old names
        run: |
          pattern='slate-chessboar[d]|slatechessboar[d]|SlateChessboar[d]|pgn-repla[y]|PgnRepla[y]|alexlinu[/]'
          content=$(git grep -nIE "$pattern" -- . ':!CHANGELOG.md' ':!docs/redirects/' || true)
          names=$(git ls-files -- . ':!CHANGELOG.md' ':!docs/redirects/' | grep -E "$pattern" || true)
          if [ -n "$content" ] || [ -n "$names" ]; then
            echo "Old names in tracked files:"
            [ -n "$content" ] && echo "$content"
            [ -n "$names" ] && echo "$names" | sed 's/^/filename: /'
            echo "::error::The project is called chessmen. Remove the old names."
            exit 1
          fi
          echo "No dead names."
