<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay one game</title>
<style>body { margin: 0; padding: 24px 16px; font: 16px/1.5 system-ui, sans-serif; } #board { max-width: 520px; margin: 0 auto; }</style>
</head>
<body>
<div id="board"></div>
<!-- One tag: the board, its stylesheet and the Classic Staunton pieces. -->
<script src="../dist/chessmen.all.js"></script>
<script>
const pgn = '[White "Paul Morphy"]\n[Black "Duke Karl / Count Isouard"]\n[Opening "Philidor Defence"]\n[Result "1-0"]\n\n1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Bxf3 5. Qxf3 dxe5 6. Bc4 Nf6 7. Qb3 Qe7 8. Nc3 c6 9. Bg5 b5 10. Nxb5 cxb5 11. Bxb5+ Nbd7 12. O-O-O Rd8 13. Rxd7 Rxd7 14. Rd1 Qe6 15. Bxd7+ Nxd7 16. Qb8+ Nxb8 17. Rd8# 1-0';
// One call: replays the game, with controls and autoplay.
Chessmen.create(document.getElementById("board"), { games: pgn });
</script>
</body>
</html>
